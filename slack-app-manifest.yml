display_information:
  name: Ad Builder
  description: Posts Ad Builder requests to #ad-building-thursday so the team and Claude see them.
  background_color: "#1d1d1f"
features:
  bot_user:
    display_name: Ad Builder
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - channels:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
